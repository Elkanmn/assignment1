<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Coffee Drinks - Contact</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

    <header>
        <h1>Coffee Drinks</h1>
        <nav>
            <a href="index.html">Home</a>
            <a href="about.html">About</a>
            <a href="contact.html" class="active">Contact</a>
        </nav>
    </header>

    <main>

        <h2>Contact Me</h2>
        <p>Fill in this form and tell me about your favourite coffee.</p>

        <form>
            <fieldset>
                <legend>Your information</legend>

                <label for="name">Your name</label>
                <input type="text" id="name" name="name" maxlength="30" required>

                <label for="email">Your email</label>
                <input type="email" id="email" name="email" required>

                <label for="cups">How many cups of coffee do you drink per day?</label>
                <input type="number" id="cups" name="cups" min="0" max="10">

                <label for="visit">Date of your last visit to a cafe</label>
                <input type="date" id="visit" name="visit">

                <label for="cup-color">Choose a colour for your cup</label>
                <input type="color" id="cup-color" name="cup-color" value="#8b4513">

                <p>Your favourite drink:</p>

                <label for="drink-espresso">Espresso</label>
                <input type="radio" id="drink-espresso" name="drink" value="espresso">

                <label for="drink-cappuccino">Cappuccino</label>
                <input type="radio" id="drink-cappuccino" name="drink" value="cappuccino">

                <label for="drink-latte">Latte</label>
                <input type="radio" id="drink-latte" name="drink" value="latte">

                <label for="news">Send me news about new drinks</label>
                <input type="checkbox" id="news" name="news">

                <label for="message">Your message</label>
                <textarea id="message" name="message" rows="5" placeholder="Write your message here"></textarea>

                <button type="submit">Send message</button>

            </fieldset>
        </form>

    </main>

    <footer>
        <p>Assignment 1. Amangaliyev Yerkhan, group IT-2507.</p>
    </footer>

</body>
</html>
